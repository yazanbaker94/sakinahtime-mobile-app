<!--
  COMPASS RING - Qibla Compass Component
  ========================================
  Coordinate system: centered at (0,0), radius 145
  ViewBox: -155 -155 310 310  (310x310 with center at origin)
  
  INTEGRATION GUIDE:
  - Place this as the base layer
  - This component does NOT rotate — it represents the fixed compass face
  - The compass rose (N/E/S/W) rotates with the device heading
  - To rotate: wrap in a <G transform="rotate(-heading)"> where heading = device compass heading
  - Layer order: 1) compass_ring  2) kaaba_icon  3) needle (on top)
  
  THEME: Uses CSS custom properties for easy dark/light switching
  Dark theme values shown. Override these in your app:
    --compass-bg: #111111
    --compass-bezel: #1a1a1a / #252525
    --compass-tick: #3a3a3a
    --compass-tick-major: #4a4a4a
    --compass-label: #707070
    --compass-north: #2ecc8f
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-155 -155 310 310" width="310" height="310">
  <defs>
    <linearGradient id="cr-bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="50%" stop-color="#252525"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <radialGradient id="cr-face" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#111111"/>
    </radialGradient>
    <filter id="cr-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Outer bezel ring -->
  <circle cx="0" cy="0" r="150" fill="url(#cr-bezel)" filter="url(#cr-shadow)"/>
  
  <!-- Compass face -->
  <circle cx="0" cy="0" r="142" fill="url(#cr-face)" stroke="#222" stroke-width="0.5"/>
  
  <!-- Inner accent ring -->
  <circle cx="0" cy="0" r="136" fill="none" stroke="#2a2a2a" stroke-width="0.5" opacity="0.4"/>
  
  <!-- Fine degree ticks (every 5°, skip multiples of 30°) -->
  <g stroke="#3a3a3a" stroke-width="0.7" opacity="0.5">
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(5)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(10)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(15)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(20)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(25)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(35)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(40)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(50)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(55)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(65)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(70)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(75)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(80)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(85)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(95)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(100)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(105)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(110)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(115)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(125)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(130)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(140)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(145)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(155)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(160)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(165)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(170)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(175)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(185)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(190)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(195)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(200)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(205)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(215)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(220)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(230)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(235)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(245)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(250)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(255)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(260)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(265)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(275)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(280)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(285)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(290)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(295)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(305)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(310)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(320)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(325)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(335)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(340)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(345)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(350)"/>
    <line x1="0" y1="-135" x2="0" y2="-131" transform="rotate(355)"/>
  </g>
  
  <!-- Major ticks every 30° -->
  <g stroke="#4a4a4a" stroke-width="1.8">
    <line x1="0" y1="-136" x2="0" y2="-124" transform="rotate(0)"/>
    <line x1="0" y1="-136" x2="0" y2="-126" transform="rotate(30)"/>
    <line x1="0" y1="-136" x2="0" y2="-126" transform="rotate(60)"/>
    <line x1="0" y1="-136" x2="0" y2="-124" transform="rotate(90)"/>
    <line x1="0" y1="-136" x2="0" y2="-126" transform="rotate(120)"/>
    <line x1="0" y1="-136" x2="0" y2="-126" transform="rotate(150)"/>
    <line x1="0" y1="-136" x2="0" y2="-124" transform="rotate(180)"/>
    <line x1="0" y1="-136" x2="0" y2="-126" transform="rotate(210)"/>
    <line x1="0" y1="-136" x2="0" y2="-126" transform="rotate(240)"/>
    <line x1="0" y1="-136" x2="0" y2="-124" transform="rotate(270)"/>
    <line x1="0" y1="-136" x2="0" y2="-126" transform="rotate(300)"/>
    <line x1="0" y1="-136" x2="0" y2="-126" transform="rotate(330)"/>
  </g>
  
  <!-- Cardinal direction labels -->
  <g font-family="Inter, SF Pro Display, system-ui" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <text x="0" y="-108" fill="#2ecc8f" font-size="18">N</text>
    <text x="110" y="0" fill="#707070" font-size="16">E</text>
    <text x="0" y="112" fill="#707070" font-size="16">S</text>
    <text x="-110" y="0" fill="#707070" font-size="16">W</text>
  </g>
  
  <!-- Inter-cardinal labels -->
  <g font-family="Inter, SF Pro Display, system-ui" font-weight="400" font-size="10" fill="#505050" text-anchor="middle" dominant-baseline="central">
    <text x="78" y="-78">NE</text>
    <text x="78" y="78">SE</text>
    <text x="-78" y="78">SW</text>
    <text x="-78" y="-78">NW</text>
  </g>
  
  <!-- Inner dashed ring -->
  <circle cx="0" cy="0" r="78" fill="none" stroke="#2a2a2a" stroke-width="0.5" stroke-dasharray="3,5" opacity="0.3"/>
</svg>
